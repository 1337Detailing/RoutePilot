plugins {
    id 'com.android.application'
}

android {
    namespace 'com.routix.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.routix.app'
        minSdk 26
        targetSdk 35
        versionCode 24
        versionName '1.8.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.mapsforge:mapsforge-core:0.21.0'
        force 'org.mapsforge:mapsforge-map:0.21.0'
        force 'org.mapsforge:mapsforge-map-android:0.21.0'
        force 'org.mapsforge:mapsforge-themes:0.21.0'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    implementation 'org.osmdroid:osmdroid-mapsforge:6.1.20'
    implementation 'org.maplibre.gl:android-sdk:13.1.0'
}
