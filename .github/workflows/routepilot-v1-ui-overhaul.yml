name: RoutePilot V1 UI overhaul

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/routepilot-v1-ui-overhaul.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  overhaul:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply RoutePilot V1 UX overhaul
        run: python3 .github/routepilot_ui_patch.py
      - name: Compile standalone app
        working-directory: ./RoutePilotStandalone
        run: gradle :app:assembleDebug --stacktrace
      - name: Commit tested overhaul
        run: |
          rm .github/workflows/routepilot-v1-ui-overhaul.yml
          rm .github/routepilot_ui_patch.py
          git config user.name 'RoutePilot Bot'
          git config user.email 'routepilot-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Modernize RoutePilot tour UI and route interactions'
          git push origin HEAD:master
