name: RoutePilot modern V1 migration retry

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/routepilot-modern-v1-retry.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply corrected migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          wf = Path('.github/workflows/routepilot-modern-v1.yml').read_text()
          marker = "python3 - <<'PY'\n"
          body = wf.split(marker, 1)[1].split('\n          PY', 1)[0]
          body = textwrap.dedent(body)
          body = body.replace('}}}}}catch(Exception ignored){}', '}}}}catch(Exception ignored){}')
          exec(compile(body, '<routepilot-migration>', 'exec'))
          PY
      - name: Compile migrated standalone app
        working-directory: ./RoutePilotStandalone
        run: gradle :app:assembleDebug --stacktrace
      - name: Commit migrated app
        run: |
          rm .github/workflows/routepilot-modern-v1.yml .github/workflows/routepilot-modern-v1-retry.yml
          git config user.name "RoutePilot Bot"
          git config user.email "routepilot-bot@users.noreply.github.com"
          git add RoutePilotStandalone/app/src/main/java/com/routepilot/app/RoutePilotProActivity.java .github/workflows/routepilot-modern-v1.yml .github/workflows/routepilot-modern-v1-retry.yml
          git commit -m "Modernize RoutePilot V1 map and guidance experience"
          git push
