name: Build Routix APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'RoutixStandalone/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'RoutixStandalone/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Routix debug APK
        working-directory: RoutixStandalone
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Name APK
        run: mv RoutixStandalone/app/build/outputs/apk/debug/app-debug.apk RoutixStandalone/app/build/outputs/apk/debug/Routix-debug.apk
      - name: Upload Routix APK
        uses: actions/upload-artifact@v7
        with:
          name: Routix-debug
          path: RoutixStandalone/app/build/outputs/apk/debug/Routix-debug.apk
          if-no-files-found: error
          retention-days: 14
