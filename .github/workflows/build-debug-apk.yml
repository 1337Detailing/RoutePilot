name: Build RoutePilot standalone apk

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - v1-work
    paths:
      - 'RoutePilotStandalone/**'
      - '.github/workflows/build-debug-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout RoutePilot
      uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10.2'

    - name: Apply RoutePilot glass GPS update
      run: python3 .github/routepilot_nav_glass_patch.py

    - name: Build standalone RoutePilot APK
      working-directory: ./RoutePilotStandalone
      run: gradle :app:assembleDebug --stacktrace

    - name: Rename APK
      run: |
        SHA=$(git rev-parse --short HEAD)
        mv RoutePilotStandalone/app/build/outputs/apk/debug/app-debug.apk RoutePilotStandalone/app/build/outputs/apk/debug/RoutePilot-V1-$SHA.apk

    - name: Archive APK
      uses: actions/upload-artifact@v7
      with:
        name: routepilot-v1-apk
        path: RoutePilotStandalone/app/build/outputs/apk/debug/RoutePilot-V1-*.apk
        retention-days: 90

    - name: Commit tested RoutePilot update
      run: |
        git config user.name 'RoutePilot Bot'
        git config user.email 'routepilot-bot@users.noreply.github.com'
        git add RoutePilotStandalone/app/build.gradle RoutePilotStandalone/app/src/main/java/com/routepilot/app/RoutePilotProActivity.java
        if ! git diff --cached --quiet; then
          git commit -m 'Modernize dialogs GPS guidance and position icon'
          git push origin HEAD:master
        fi
