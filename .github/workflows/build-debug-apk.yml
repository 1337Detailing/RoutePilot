name: Build RoutePilot standalone apk

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'RoutePilotStandalone/**'
      - '.github/workflows/build-debug-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout RoutePilot
      uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10.2'

    - name: Build standalone RoutePilot APK
      working-directory: ./RoutePilotStandalone
      run: gradle :app:assembleDebug --stacktrace

    - name: Rename APK
      run: |
        SHA=$(git rev-parse --short HEAD)
        mv RoutePilotStandalone/app/build/outputs/apk/debug/app-debug.apk RoutePilotStandalone/app/build/outputs/apk/debug/RoutePilot-standalone-$SHA.apk

    - name: Archive APK
      uses: actions/upload-artifact@v7
      with:
        name: routepilot-standalone-apk
        path: RoutePilotStandalone/app/build/outputs/apk/debug/RoutePilot-standalone-*.apk
        retention-days: 90
