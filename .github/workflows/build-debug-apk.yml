name: Build Routix rebrand

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build-debug-apk.yml'
      - '.github/routix_rebrand.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout project
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10.2'

    - name: Apply Routix rebrand
      run: python3 .github/routix_rebrand.py

    - name: Build rebranded Routix APK
      working-directory: ./RoutixStandalone
      run: gradle :app:assembleDebug --stacktrace

    - name: Rename APK
      run: |
        SHA=$(git rev-parse --short HEAD)
        mv RoutixStandalone/app/build/outputs/apk/debug/app-debug.apk RoutixStandalone/app/build/outputs/apk/debug/Routix-V1-$SHA.apk

    - name: Archive tested APK
      uses: actions/upload-artifact@v7
      with:
        name: routix-rebrand-test-apk
        path: RoutixStandalone/app/build/outputs/apk/debug/Routix-V1-*.apk
        retention-days: 7

    - name: Commit tested Routix rebrand
      run: |
        git config user.name "Routix Bot"
        git config user.email "routix-bot@users.noreply.github.com"
        git add -A
        if ! git diff --cached --quiet; then
          git commit -m "Rebrand application as Routix"
          git push origin HEAD:master
        fi
