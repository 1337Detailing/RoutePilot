name: RoutePilot UI hotfix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/routepilot-ui-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply focused RoutePilot fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('RoutePilotStandalone/app/src/main/java/com/routepilot/app/RoutePilotProActivity.java')
          src = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'import org.osmdroid.mapsforge.MapsForgeTileProvider;\nimport org.osmdroid.mapsforge.MapsForgeTileSource;',
                  'import org.mapsforge.map.rendertheme.InternalRenderTheme;\nimport org.osmdroid.mapsforge.MapsForgeTileProvider;\nimport org.osmdroid.mapsforge.MapsForgeTileSource;\nimport org.osmdroid.tileprovider.MapTileProviderBasic;'
              ),
              (
                  'TextView plus=circle("＋",accent());plus.setOnClickListener(v->showMap());',
                  'TextView plus=circle("＋",accent());plus.setOnClickListener(v->openNewRecording());'
              ),
              (
                  '    private void showSettings(){if(guiding)return;exitFocusMode();clearPage();map.setVisibility(View.GONE);topBar.setVisibility(View.GONE);recordSheet.setVisibility(View.GONE);dock.setVisibility(View.VISIBLE);page=settingsPage();root.addView(page,pageLp());selectTab("settings");fade(page);}\n',
                  '    private void showSettings(){if(guiding)return;exitFocusMode();clearPage();map.setVisibility(View.GONE);topBar.setVisibility(View.GONE);recordSheet.setVisibility(View.GONE);dock.setVisibility(View.VISIBLE);page=settingsPage();root.addView(page,pageLp());selectTab("settings");fade(page);}\n    private void openNewRecording(){showMap();setCollapsed(false);if(recordBtn!=null)recordBtn.post(()->recordBtn.requestFocus());}\n'
              ),
              (
                  'LinearLayout head=new LinearLayout(this);head.setGravity(Gravity.CENTER_VERTICAL);LinearLayout title=new LinearLayout(this);title.setOrientation(LinearLayout.VERTICAL);title.addView(text(store.displayName(s.file),18,Typeface.BOLD,Color.WHITE));title.addView(text(formatDuration(s.durationMs)+"  •  "+formatDistance(s.distanceM)+"  •  "+s.events.size()+" repères",11,Typeface.NORMAL,MUTED));head.addView(title,new LinearLayout.LayoutParams(0,-2,1));TextView close=circle("×",GLASS2);close.setOnClickListener(v->closePlan());head.addView(close,new LinearLayout.LayoutParams(dp(40),dp(40)));sh.addView(head);',
                  'LinearLayout head=new LinearLayout(this);head.setGravity(Gravity.CENTER_VERTICAL);LinearLayout title=new LinearLayout(this);title.setOrientation(LinearLayout.VERTICAL);title.addView(text(store.displayName(s.file),18,Typeface.BOLD,Color.WHITE));title.addView(text(formatDuration(s.durationMs)+"  •  "+formatDistance(s.distanceM)+"  •  "+s.events.size()+" repères",11,Typeface.NORMAL,MUTED));head.addView(title,new LinearLayout.LayoutParams(0,-2,1));TextView focus=circle("▣",GLASS2);focus.setOnClickListener(v->enterFocusMode());LinearLayout.LayoutParams fl=new LinearLayout.LayoutParams(dp(40),dp(40));fl.rightMargin=dp(6);head.addView(focus,fl);TextView close=circle("×",GLASS2);close.setOnClickListener(v->closePlan());head.addView(close,new LinearLayout.LayoutParams(dp(40),dp(40)));sh.addView(head);'
              ),
              (
                  '        if(s.points.size()<2){toast("Trace insuffisante");return;}new AlertDialog.Builder(this).setTitle("Démarrer la tournée").setMessage("RoutePilot suivra la trace GPS originale sans recalculer un autre itinéraire.").setItems(new String[]{"Sens enregistré","Sens inverse"},(d,w)->startGuidance(s,w==1)).show();',
                  '        if(s.points.size()<2){toast("Trace insuffisante");return;}new AlertDialog.Builder(this).setTitle("Démarrer la tournée").setMessage("RoutePilot suivra la trace GPS originale sans recalculer un autre itinéraire.").setNegativeButton("Annuler",null).setNeutralButton("Sens inverse",(d,w)->startGuidance(s,true)).setPositiveButton("Démarrer",(d,w)->startGuidance(s,false)).show();'
              ),
              (
                  '    private boolean applyOfflineProvider(FranceOfflineManager.Pack p){try{MapsForgeTileSource src=MapsForgeTileSource.createFromFiles(new File[]{FranceOfflineManager.file(this,p)});map.setTileProvider(new MapsForgeTileProvider(new SimpleRegisterReceiver(this),src,null));map.setUseDataConnection(false);return true;}catch(Exception e){return false;}}',
                  '    private boolean applyOfflineProvider(FranceOfflineManager.Pack p){try{MapsForgeTileSource src=MapsForgeTileSource.createFromFiles(new File[]{FranceOfflineManager.file(this,p)},InternalRenderTheme.DEFAULT,"RoutePilotDefault");src.setUserScaleFactor(1.0f);map.setTileProvider(new MapsForgeTileProvider(new SimpleRegisterReceiver(this),src,null));map.setTilesScaledToDpi(false);map.resetTilesScaleFactor();map.setUseDataConnection(false);map.invalidate();return true;}catch(Exception e){return false;}}'
              ),
              (
                  '    private void activateOnline(){map.setTileSource(TileSourceFactory.MAPNIK);map.setUseDataConnection(true);prefs.edit().remove("offline_pack").apply();updateMapChip();toast("OpenStreetMap en ligne activée");showMap();}',
                  '    private void applyOnlineProvider(){MapTileProviderBasic online=new MapTileProviderBasic(getApplicationContext(),TileSourceFactory.MAPNIK);map.setTileProvider(online);map.setTileSource(TileSourceFactory.MAPNIK);map.setTilesScaledToDpi(true);map.resetTilesScaleFactor();map.setUseDataConnection(true);map.invalidate();}\n    private void activateOnline(){applyOnlineProvider();prefs.edit().remove("offline_pack").apply();updateMapChip();toast("OpenStreetMap en ligne activée");showMap();}'
              ),
              (
                  '    private void restoreOfflineMap(){FranceOfflineManager.Pack p=FranceOfflineManager.find(prefs.getString("offline_pack",null));if(p!=null&&FranceOfflineManager.isInstalled(this,p)){map.postDelayed(()->{if(!applyOfflineProvider(p)){prefs.edit().remove("offline_pack").apply();map.setTileSource(TileSourceFactory.MAPNIK);map.setUseDataConnection(true);}updateMapChip();},120);}}',
                  '    private void restoreOfflineMap(){FranceOfflineManager.Pack p=FranceOfflineManager.find(prefs.getString("offline_pack",null));if(p!=null&&FranceOfflineManager.isInstalled(this,p)){map.postDelayed(()->{if(!applyOfflineProvider(p)){prefs.edit().remove("offline_pack").apply();applyOnlineProvider();}updateMapChip();},120);}}'
              ),
              (
                  '    private void enterFocusMode(){if(guiding)return;focusMode=true;topBar.setVisibility(View.GONE);recordSheet.setVisibility(View.GONE);dock.setVisibility(View.GONE);if(focusRestore==null){TextView restore=circle("⌃",Color.argb(220,31,32,38));restore.setOnClickListener(v->exitFocusMode());focusRestore=restore;FrameLayout.LayoutParams p=new FrameLayout.LayoutParams(dp(52),dp(52),Gravity.BOTTOM|Gravity.END);p.setMargins(0,0,dp(18),safeBottom()+dp(18));root.addView(restore,p);}fade(focusRestore);}',
                  '    private void enterFocusMode(){if(guiding)return;focusMode=true;topBar.setVisibility(View.GONE);recordSheet.setVisibility(View.GONE);dock.setVisibility(View.GONE);if(planSheet!=null)planSheet.setVisibility(View.GONE);if(focusRestore==null){TextView restore=circle("⌃",Color.argb(220,31,32,38));restore.setOnClickListener(v->exitFocusMode());focusRestore=restore;FrameLayout.LayoutParams p=new FrameLayout.LayoutParams(dp(52),dp(52),Gravity.BOTTOM|Gravity.END);p.setMargins(0,0,dp(18),safeBottom()+dp(18));root.addView(restore,p);}fade(focusRestore);}'
              ),
              (
                  '    private void exitFocusMode(){focusMode=false;if(focusRestore!=null){root.removeView(focusRestore);focusRestore=null;}if(page==null&&!guiding){topBar.setVisibility(View.VISIBLE);recordSheet.setVisibility(View.VISIBLE);dock.setVisibility(View.VISIBLE);}}',
                  '    private void exitFocusMode(){focusMode=false;if(focusRestore!=null){root.removeView(focusRestore);focusRestore=null;}if(guiding)return;if(planSheet!=null){planSheet.setVisibility(View.VISIBLE);dock.setVisibility(View.VISIBLE);return;}if(page==null){topBar.setVisibility(View.VISIBLE);recordSheet.setVisibility(View.VISIBLE);dock.setVisibility(View.VISIBLE);}}'
              )
          ]

          for old, new in replacements:
              if old not in src:
                  raise SystemExit('Expected source fragment not found:\n' + old[:240])
              src = src.replace(old, new, 1)

          path.write_text(src, encoding='utf-8')
          PY

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "RoutePilot CI"
          git config user.email "actions@users.noreply.github.com"
          git add RoutePilotStandalone/app/src/main/java/com/routepilot/app/RoutePilotProActivity.java
          git commit -m "Fix route controls, plan focus and offline map rendering"
          git push origin HEAD:master
