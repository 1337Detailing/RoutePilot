name: RoutePilot hours and liquid glass update

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/routepilot-hours-liquid-glass.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Add work hours store
        run: |
          cat > RoutePilotStandalone/app/src/main/java/com/routepilot/app/WorkHoursStore.java <<'JAVA'
          package com.routepilot.app;

          import android.content.SharedPreferences;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Map;

          final class WorkHoursStore {
              static final class Entry {
                  final long id;
                  final String date;
                  final int startMinutes;
                  final int endMinutes;
                  final int pauseMinutes;

                  Entry(long id, String date, int startMinutes, int endMinutes, int pauseMinutes) {
                      this.id=id;
                      this.date=date;
                      this.startMinutes=startMinutes;
                      this.endMinutes=endMinutes;
                      this.pauseMinutes=Math.max(0,pauseMinutes);
                  }

                  int netMinutes() {
                      int end=endMinutes;
                      if(end<startMinutes) end+=24*60;
                      return Math.max(0,end-startMinutes-pauseMinutes);
                  }

                  String monthKey() {
                      return date!=null&&date.length()>=7?date.substring(0,7):"";
                  }
              }

              private static final String KEY="work_hours_v1";
              private final SharedPreferences prefs;

              WorkHoursStore(SharedPreferences prefs) {
                  this.prefs=prefs;
              }

              List<Entry> entries() {
                  List<Entry> out=new ArrayList<>();
                  try {
                      JSONArray a=new JSONArray(prefs.getString(KEY,"[]"));
                      for(int i=0;i<a.length();i++) {
                          JSONObject o=a.optJSONObject(i);
                          if(o==null) continue;
                          String date=o.optString("date","");
                          int start=o.optInt("start",-1),end=o.optInt("end",-1),pause=o.optInt("pause",0);
                          if(date.length()!=10||start<0||end<0) continue;
                          out.add(new Entry(o.optLong("id",i+1),date,start,end,pause));
                      }
                  } catch(Exception ignored) {}
                  Collections.sort(out,(a,b)->{int d=b.date.compareTo(a.date);return d!=0?d:Long.compare(b.id,a.id);});
                  return out;
              }

              Entry add(String date,int start,int end,int pause) {
                  Entry e=new Entry(System.currentTimeMillis(),date,start,end,pause);
                  List<Entry> all=entries();
                  all.add(e);
                  save(all);
                  return e;
              }

              void delete(long id) {
                  List<Entry> all=entries();
                  all.removeIf(e->e.id==id);
                  save(all);
              }

              int totalForMonth(String monthKey) {
                  int total=0;
                  for(Entry e:entries()) if(monthKey.equals(e.monthKey())) total+=e.netMinutes();
                  return total;
              }

              Map<String,Integer> totalsByMonth() {
                  Map<String,Integer> totals=new LinkedHashMap<>();
                  for(Entry e:entries()) totals.put(e.monthKey(),totals.getOrDefault(e.monthKey(),0)+e.netMinutes());
                  return totals;
              }

              private void save(List<Entry> all) {
                  JSONArray a=new JSONArray();
                  try {
                      for(Entry e:all) {
                          JSONObject o=new JSONObject();
                          o.put("id",e.id);o.put("date",e.date);o.put("start",e.startMinutes);o.put("end",e.endMinutes);o.put("pause",e.pauseMinutes);
                          a.put(o);
                      }
                  } catch(Exception ignored) {}
                  prefs.edit().putString(KEY,a.toString()).apply();
              }
          }
          JAVA

      - name: Modernize onboarding and privacy screen
        run: |
          cat > RoutePilotStandalone/app/src/main/java/com/routepilot/app/OnboardingActivity.java <<'JAVA'
          package com.routepilot.app;

          import android.animation.ValueAnimator;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.view.animation.DecelerateInterpolator;
          import android.view.animation.OvershootInterpolator;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import androidx.appcompat.app.AppCompatActivity;

          public class OnboardingActivity extends AppCompatActivity {
              private static final int BG=Color.rgb(7,8,12);
              private static final int BLUE=Color.rgb(10,132,255);
              private static final int CYAN=Color.rgb(82,210,255);
              private static final int GLASS=Color.argb(178,31,34,44);
              private static final int MUTED=Color.argb(184,255,255,255);

              private SharedPreferences prefs;
              private FrameLayout root;
              private LinearLayout pageHost,dots;
              private TextView action;
              private int step=0;
              private boolean locationConsent=false,dataConsent=false;

              @Override protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  prefs=getSharedPreferences("routepilot",MODE_PRIVATE);
                  if(prefs.getBoolean("onboarding_complete",false)){launchApp();return;}
                  getWindow().setStatusBarColor(Color.TRANSPARENT);
                  getWindow().setNavigationBarColor(BG);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);

                  root=new FrameLayout(this);
                  root.setBackground(ambientBackground());
                  addAmbientOrb(Color.rgb(25,112,255),dp(320),Gravity.TOP|Gravity.END,-dp(90),-dp(70),5200);
                  addAmbientOrb(Color.rgb(160,65,255),dp(280),Gravity.BOTTOM|Gravity.START,-dp(90),dp(30),6100);

                  LinearLayout shell=new LinearLayout(this);shell.setOrientation(LinearLayout.VERTICAL);shell.setPadding(dp(20),dp(34),dp(20),dp(20));
                  root.addView(shell,new FrameLayout.LayoutParams(-1,-1));

                  LinearLayout top=new LinearLayout(this);top.setGravity(Gravity.CENTER_VERTICAL);top.setPadding(dp(10),dp(8),dp(10),dp(8));top.setBackground(liquid(Color.argb(135,34,38,49),24));top.setElevation(dp(12));
                  TextView mark=label("RP",15,Typeface.BOLD,Color.WHITE);mark.setGravity(Gravity.CENTER);mark.setBackground(liquid(BLUE,17));top.addView(mark,new LinearLayout.LayoutParams(dp(42),dp(42)));
                  LinearLayout brandBox=new LinearLayout(this);brandBox.setOrientation(LinearLayout.VERTICAL);brandBox.addView(label("RoutePilot",18,Typeface.BOLD,Color.WHITE));brandBox.addView(label("Tournées terrain • données sous ton contrôle",9,Typeface.NORMAL,MUTED));LinearLayout.LayoutParams bp=new LinearLayout.LayoutParams(0,-2,1f);bp.leftMargin=dp(11);top.addView(brandBox,bp);
                  TextView skip=label("Passer",12,Typeface.BOLD,MUTED);skip.setGravity(Gravity.CENTER);skip.setBackground(liquid(Color.argb(42,255,255,255),15));skip.setOnClickListener(v->{press(v);step=3;render();});top.addView(skip,new LinearLayout.LayoutParams(dp(68),dp(38)));
                  shell.addView(top);

                  pageHost=new LinearLayout(this);pageHost.setOrientation(LinearLayout.VERTICAL);LinearLayout.LayoutParams ph=new LinearLayout.LayoutParams(-1,0,1f);ph.topMargin=dp(26);shell.addView(pageHost,ph);
                  dots=new LinearLayout(this);dots.setGravity(Gravity.CENTER);LinearLayout.LayoutParams dl=new LinearLayout.LayoutParams(-1,dp(24));dl.bottomMargin=dp(10);shell.addView(dots,dl);

                  action=label("Continuer",16,Typeface.BOLD,Color.WHITE);action.setGravity(Gravity.CENTER);action.setBackground(liquid(BLUE,22));action.setElevation(dp(12));action.setOnClickListener(v->next());shell.addView(action,new LinearLayout.LayoutParams(-1,dp(58)));
                  TextView version=label("RoutePilot 1.0.3 • stockage local • sans compte RoutePilot",10,Typeface.NORMAL,Color.argb(118,255,255,255));version.setGravity(Gravity.CENTER);LinearLayout.LayoutParams vp=new LinearLayout.LayoutParams(-1,-2);vp.topMargin=dp(12);shell.addView(version,vp);

                  setContentView(root);render();
              }

              private void render(){
                  pageHost.animate().cancel();pageHost.animate().alpha(0f).translationX(-dp(16)).scaleX(.985f).scaleY(.985f).setDuration(120).withEndAction(()->{
                      pageHost.removeAllViews();pageHost.setAlpha(0f);pageHost.setTranslationX(dp(22));pageHost.setScaleX(.98f);pageHost.setScaleY(.98f);
                      if(step==0)intro();else if(step==1)features();else if(step==2)offline();else if(step==3)privacy();else consent();
                      pageHost.animate().alpha(1f).translationX(0).scaleX(1f).scaleY(1f).setDuration(330).setInterpolator(new DecelerateInterpolator()).start();updateDots();
                  }).start();
              }

              private void intro(){hero("⌁","La tournée, sans le chaos.","Enregistre précisément ton parcours réel, mémorise les actions métier et rejoue la tournée plus tard avec une interface pensée pour le terrain.");featureCard("Trace GPS fidèle","Les points sont stockés avec leur précision et leur heure.");action.setText("Découvrir RoutePilot");enableAction(true);}
              private void features(){hero("◎","Ton trajet devient un guide","Marche arrière et 2 côtés sont enregistrés exactement là où tu les déclenches, puis réapparaissent au bon moment pendant le guidage.");featureCard("↶  Marche arrière","Repère géolocalisé et alerte à l’approche.");featureCard("⇆  2 côtés","Repère métier discret sur la carte, clair dans le HUD.");featureCard("▶  Relecture visuelle","La trace enregistrée reste la référence, sans navigation vocale.");action.setText("Continuer");enableAction(true);}
              private void offline(){hero("▧","Online quand tu veux. Offline quand il faut.","OpenStreetMap sert de fond en ligne. Les packs vectoriels français peuvent rester sur le téléphone pour travailler sans réseau.");featureCard("Cartes séparées de l’APK","Tu télécharges uniquement les zones utiles depuis Réglages.");featureCard("Tournées locales","Les fichiers GPX restent dans le stockage privé de RoutePilot jusqu’à une action de partage.");action.setText("Voir la confidentialité");enableAction(true);}

              private void privacy(){
                  hero("◉","Confidentialité, sans texte flou","Voici concrètement ce qui sort du téléphone et ce qui reste local dans cette V1.");
                  privacyCard("Position précise","Utilisée quand RoutePilot est ouvert pour enregistrer et guider. L’app ne demande pas la permission de localisation en arrière-plan.",GREENISH());
                  privacyCard("Tournées & heures","GPX, repères métier et heures de travail sont enregistrés localement. Ils ne sont partagés que lorsque tu déclenches une action de partage/export.",CYAN);
                  privacyCard("Services réseau","En carte OSM en ligne, les requêtes de tuiles vont aux serveurs OpenStreetMap. Pour rejoindre le départ d’une tournée, les coordonnées départ/arrivée sont envoyées au routeur public OSRM afin de calculer cet itinéraire.",Color.rgb(191,90,242));
                  privacyCard("Compte & cloud","Cette V1 ne contient ni compte RoutePilot ni synchronisation cloud des tournées.",Color.rgb(48,209,88));
                  action.setText("J’ai compris");enableAction(true);
              }

              private void consent(){
                  hero("✓","Tu gardes le contrôle","Deux confirmations avant d’activer RoutePilot. Elles sont mémorisées localement sur cet appareil.");
                  pageHost.addView(consentRow("Localisation précise","J’accepte son utilisation pour enregistrer et guider une tournée.",true),cardLp());
                  pageHost.addView(consentRow("Données & réseau","J’ai compris le stockage local, le partage manuel, OSM et OSRM décrits à l’étape précédente.",false),cardLp());
                  action.setText("Commencer avec RoutePilot");updateConsentButton();
              }

              private void hero(String icon,String title,String body){
                  TextView orb=label(icon,35,Typeface.BOLD,Color.WHITE);orb.setGravity(Gravity.CENTER);orb.setBackground(liquid(Color.argb(118,10,132,255),34));orb.setElevation(dp(16));pageHost.addView(orb,new LinearLayout.LayoutParams(dp(76),dp(76)));orb.setScaleX(.7f);orb.setScaleY(.7f);orb.setAlpha(0f);orb.animate().scaleX(1f).scaleY(1f).alpha(1f).setDuration(420).setInterpolator(new OvershootInterpolator(.9f)).start();
                  TextView t=label(title,31,Typeface.BOLD,Color.WHITE);t.setLineSpacing(0,.96f);LinearLayout.LayoutParams tp=new LinearLayout.LayoutParams(-1,-2);tp.topMargin=dp(25);pageHost.addView(t,tp);
                  TextView b=label(body,14.5f,Typeface.NORMAL,MUTED);b.setLineSpacing(dp(5),1f);LinearLayout.LayoutParams bl=new LinearLayout.LayoutParams(-1,-2);bl.topMargin=dp(12);bl.bottomMargin=dp(18);pageHost.addView(b,bl);
              }

              private void featureCard(String title,String body){LinearLayout card=glassCard();card.addView(label(title,15,Typeface.BOLD,Color.WHITE));TextView b=label(body,12,Typeface.NORMAL,MUTED);LinearLayout.LayoutParams bp=new LinearLayout.LayoutParams(-1,-2);bp.topMargin=dp(4);card.addView(b,bp);pageHost.addView(card,cardLp());}
              private void privacyCard(String title,String body,int color){LinearLayout card=glassCard();LinearLayout line=new LinearLayout(this);line.setGravity(Gravity.CENTER_VERTICAL);TextView dot=label("●",14,Typeface.BOLD,color);line.addView(dot,new LinearLayout.LayoutParams(dp(24),-2));line.addView(label(title,15,Typeface.BOLD,Color.WHITE),new LinearLayout.LayoutParams(0,-2,1));card.addView(line);TextView b=label(body,11.5f,Typeface.NORMAL,MUTED);b.setLineSpacing(dp(3),1f);LinearLayout.LayoutParams bp=new LinearLayout.LayoutParams(-1,-2);bp.topMargin=dp(5);card.addView(b,bp);pageHost.addView(card,cardLp());}

              private View consentRow(String title,String body,boolean location){
                  LinearLayout row=new LinearLayout(this);row.setGravity(Gravity.CENTER_VERTICAL);row.setPadding(dp(14),dp(13),dp(14),dp(13));row.setBackground(liquid(GLASS,20));
                  TextView check=label("",16,Typeface.BOLD,Color.WHITE);check.setGravity(Gravity.CENTER);LinearLayout.LayoutParams cp=new LinearLayout.LayoutParams(dp(30),dp(30));cp.rightMargin=dp(12);row.addView(check,cp);
                  LinearLayout texts=new LinearLayout(this);texts.setOrientation(LinearLayout.VERTICAL);texts.addView(label(title,14,Typeface.BOLD,Color.WHITE));texts.addView(label(body,11,Typeface.NORMAL,MUTED));row.addView(texts,new LinearLayout.LayoutParams(0,-2,1));
                  Runnable paint=()->{boolean on=location?locationConsent:dataConsent;check.setText(on?"✓":"");check.setBackground(liquid(on?BLUE:Color.argb(65,255,255,255),99));};paint.run();row.setOnClickListener(v->{press(v);if(location)locationConsent=!locationConsent;else dataConsent=!dataConsent;paint.run();updateConsentButton();});return row;
              }

              private LinearLayout glassCard(){LinearLayout c=new LinearLayout(this);c.setOrientation(LinearLayout.VERTICAL);c.setPadding(dp(15),dp(13),dp(15),dp(13));c.setBackground(liquid(GLASS,21));c.setElevation(dp(8));return c;}
              private LinearLayout.LayoutParams cardLp(){LinearLayout.LayoutParams p=new LinearLayout.LayoutParams(-1,-2);p.bottomMargin=dp(8);return p;}
              private void updateConsentButton(){enableAction(locationConsent&&dataConsent);}
              private void enableAction(boolean on){action.setEnabled(on);action.animate().alpha(on?1f:.35f).setDuration(160).start();}

              private void updateDots(){dots.removeAllViews();for(int i=0;i<5;i++){View d=new View(this);d.setBackground(liquid(i==step?BLUE:Color.argb(55,255,255,255),99));LinearLayout.LayoutParams p=new LinearLayout.LayoutParams(dp(i==step?25:7),dp(7));p.setMargins(dp(4),0,dp(4),0);dots.addView(d,p);}}
              private void next(){press(action);if(step<4){step++;render();return;}if(!action.isEnabled())return;prefs.edit().putBoolean("onboarding_complete",true).putBoolean("privacy_notice_seen",true).putBoolean("location_usage_accepted",true).apply();root.animate().alpha(0f).scaleX(1.015f).scaleY(1.015f).setDuration(260).withEndAction(this::launchApp).start();}
              private void launchApp(){startActivity(new Intent(this,RoutePilotProActivity.class));finish();overridePendingTransition(android.R.anim.fade_in,android.R.anim.fade_out);}
              private void press(View v){v.animate().scaleX(.965f).scaleY(.965f).setDuration(75).withEndAction(()->v.animate().scaleX(1).scaleY(1).setDuration(210).setInterpolator(new OvershootInterpolator(.7f)).start()).start();}

              private void addAmbientOrb(int color,int size,int gravity,int x,int y,long duration){View orb=new View(this);GradientDrawable g=new GradientDrawable();g.setShape(GradientDrawable.OVAL);g.setGradientType(GradientDrawable.RADIAL_GRADIENT);g.setColors(new int[]{Color.argb(95,Color.red(color),Color.green(color),Color.blue(color)),Color.argb(0,Color.red(color),Color.green(color),Color.blue(color))});g.setGradientRadius(size*.52f);orb.setBackground(g);FrameLayout.LayoutParams lp=new FrameLayout.LayoutParams(size,size,gravity);lp.setMargins(x,y,x,y);root.addView(orb,lp);ValueAnimator a=ValueAnimator.ofFloat(0f,1f);a.setDuration(duration);a.setRepeatCount(ValueAnimator.INFINITE);a.setRepeatMode(ValueAnimator.REVERSE);a.addUpdateListener(v->{float q=(float)v.getAnimatedValue();orb.setTranslationX(dp(22)*q);orb.setTranslationY(dp(28)*q);orb.setScaleX(1f+.08f*q);orb.setScaleY(1f+.08f*q);orb.setAlpha(.75f+.2f*q);});a.start();}
              private GradientDrawable ambientBackground(){return new GradientDrawable(GradientDrawable.Orientation.TL_BR,new int[]{Color.rgb(5,8,15),Color.rgb(13,10,22),Color.rgb(6,12,18)});}
              private GradientDrawable liquid(int color,int radius){int a=Color.alpha(color);int bright=Color.argb(Math.min(255,a+18),Math.min(255,Color.red(color)+30),Math.min(255,Color.green(color)+30),Math.min(255,Color.blue(color)+34));int tail=Color.argb(Math.max(24,a-30),Math.max(0,Color.red(color)-12),Math.max(0,Color.green(color)-12),Math.max(0,Color.blue(color)-8));GradientDrawable g=new GradientDrawable(GradientDrawable.Orientation.TL_BR,new int[]{bright,color,tail});g.setCornerRadius(dp(radius));g.setStroke(dp(1),Color.argb(68,255,255,255));return g;}
              private int GREENISH(){return Color.rgb(48,209,88);}
              private TextView label(String s,float sp,int style,int color){TextView t=new TextView(this);t.setText(s);t.setTextSize(sp);t.setTypeface(Typeface.create("sans-serif",style));t.setTextColor(color);t.setIncludeFontPadding(false);return t;}
              private int dp(int v){return Math.round(v*getResources().getDisplayMetrics().density);}
          }
          JAVA

