name: RoutePilot modern V1 migration

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/routepilot-modern-v1.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply modern V1 migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('RoutePilotStandalone/app/src/main/java/com/routepilot/app/RoutePilotProActivity.java')
          s = path.read_text()

          def rep(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'missing replacement: {label}')
              s = s.replace(old, new, 1)

          rep('import android.app.AlertDialog;\n', '''import android.app.AlertDialog;\nimport android.app.Dialog;\nimport android.animation.ValueAnimator;\n''', 'dialog imports')
          rep('import android.graphics.Paint;\n', '''import android.graphics.Paint;\nimport android.graphics.RenderEffect;\nimport android.graphics.Shader;\n''', 'render imports')
          rep('import android.graphics.drawable.BitmapDrawable;\n', '''import android.graphics.drawable.BitmapDrawable;\nimport android.graphics.drawable.ColorDrawable;\n''', 'drawable imports')
          rep('import android.os.Bundle;\n', '''import android.os.Build;\nimport android.os.Bundle;\n''', 'build import')
          rep('import android.view.HapticFeedbackConstants;\n', '''import android.view.HapticFeedbackConstants;\nimport android.view.MotionEvent;\n''', 'motion import')
          rep('import android.view.animation.DecelerateInterpolator;\n', '''import android.view.animation.DecelerateInterpolator;\nimport android.view.animation.OvershootInterpolator;\n''', 'overshoot import')
          rep('import org.osmdroid.config.Configuration;\n', '''import org.osmdroid.config.Configuration;\nimport org.json.JSONArray;\nimport org.json.JSONObject;\n''', 'json imports')
          rep('import java.io.File;\n', '''import java.io.BufferedReader;\nimport java.io.File;\nimport java.io.InputStreamReader;\nimport java.net.HttpURLConnection;\nimport java.net.URL;\n''', 'network imports')

          rep('private Polyline liveTrack,previewTrack;', 'private Polyline liveTrack,previewTrack,approachTrack;', 'polyline fields')
          rep('private boolean recording,paused,collapsed,focusMode,guiding;', 'private boolean recording,paused,collapsed,focusMode,guiding,guidanceCameraFollow=true,approachingStart;', 'guidance booleans')
          rep('private double liveDistance;', 'private double liveDistance,approachDistanceM;\n    private String approachInstruction="Calcul de l’itinéraire vers le départ…";', 'approach fields')

          old = 'map=new MapView(this);map.setTileSource(TileSourceFactory.MAPNIK);map.setUseDataConnection(true);map.setMultiTouchControls(true);map.setTilesScaledToDpi(true);map.setMinZoomLevel(3.0);map.setMaxZoomLevel(20.0);map.getController().setZoom(18.2);map.setHorizontalMapRepetitionEnabled(false);map.setVerticalMapRepetitionEnabled(false);root.addView(map,new FrameLayout.LayoutParams(-1,-1));'
          new = 'map=new MapView(this);map.setTileSource(TileSourceFactory.MAPNIK);map.setUseDataConnection(true);map.setMultiTouchControls(true);map.setTilesScaledToDpi(true);map.setMinZoomLevel(3.0);map.setMaxZoomLevel(20.0);map.getController().setZoom(18.2);map.setHorizontalMapRepetitionEnabled(false);map.setVerticalMapRepetitionEnabled(false);map.setOnTouchListener((v,e)->{if(guiding&&e.getActionMasked()==MotionEvent.ACTION_DOWN)guidanceCameraFollow=false;return false;});root.addView(map,new FrameLayout.LayoutParams(-1,-1));'
          rep(old,new,'map manual camera')

